# Campos "x-" são ignorados pelo compose; servem para reaproveitar valores via âncora YAML.
# Dentro da rede do compose o host do banco é o nome do serviço, "db".
x-database-url: &database-url postgresql://${POSTGRES_USER:-opsboard}:${POSTGRES_PASSWORD:-opsboard}@db:5432/${POSTGRES_DB:-opsboard}

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-opsboard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-opsboard}
      POSTGRES_DB: ${POSTGRES_DB:-opsboard}
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    # O migrate só roda quando o Postgres aceita conexões (ver depends_on abaixo).
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

  # Job de uso único: aplica as migrations pendentes e termina.
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: migrate
    environment:
      DATABASE_URL: *database-url
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runtime
    environment:
      PORT: 3000
      # Sem valor padrão de propósito: melhor falhar do que subir com um segredo conhecido.
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env (veja .env.example)}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      LOGIN_RATE_LIMIT: ${LOGIN_RATE_LIMIT:-5}
      LOGIN_RATE_TTL: ${LOGIN_RATE_TTL:-60}
      # A imagem roda com NODE_ENV=production, onde o Swagger é desligado por padrão.
      # Ligado aqui porque o compose é a demonstração local; desligue num deploy real.
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
      DATABASE_URL: *database-url
    ports:
      - '3000:3000'
    depends_on:
      # A api só sobe depois que as migrations terminaram com sucesso (exit 0).
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - '8080:80'
    depends_on:
      - api

volumes:
  pgdata:
