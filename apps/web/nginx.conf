server {
  listen 80;
  root /usr/share/nginx/html;

  # A barra final no proxy_pass remove o prefixo: /api/health -> http://api:3000/health.
  # Front e API ficam na mesma origem, então não precisamos de CORS.
  location /api/ {
    proxy_pass http://api:3000/;
    # Acima do 1 MB da importação, para quem decide (e responde no formato padrão) ser a API.
    # Com o padrão do nginx (1m), um arquivo no limite daria 413 em HTML, sem `code`.
    client_max_body_size 2m;
  }

  # Rotas do React (SPA) caem no index.html.
  location / {
    try_files $uri /index.html;
  }
}
